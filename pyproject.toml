[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "omrkit"
version = "2.1.0"
description = "Modern Optical Mark Recognition engine with PDF/ArUco alignment, confidence-scored hybrid bubble detection, printable sheet generation, exam psychometrics, REST API, and Visual Web Studio."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Duhan Guler" },
]
keywords = [
    "omr",
    "optical-mark-recognition",
    "computer-vision",
    "opencv",
    "exam-grading",
    "bubble-sheet",
    "aruco",
    "psychometrics",
    "fastapi",
    "edtech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Testing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pypdfium2>=4.28.0",
    "reportlab>=4.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
excel = [
    "openpyxl>=3.1.2",
]
all = [
    "omrkit[studio,excel]",
]
dev = [
    "build>=1.2.1",
    "twine>=5.1.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/duhanguler/omr"
Repository = "https://github.com/duhanguler/omr"
Documentation = "https://github.com/duhanguler/omr#readme"
Changelog = "https://github.com/duhanguler/omr/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/duhanguler/omr/issues"

[project.scripts]
omrkit = "omrkit.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omrkit"]
artifacts = [
    "src/omrkit/api/static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/omrkit",
    "/README.md",
    "/LICENSE",
]
artifacts = [
    "src/omrkit/api/static/**",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["omrkit"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
files = ["src/omrkit"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
