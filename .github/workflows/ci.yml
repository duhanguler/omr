name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-qa:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install omrkit with all and dev extras
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]"

      - name: Lint and format check (ruff)
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Static type check (mypy)
        run: .venv/bin/mypy src/omrkit

      - name: Run test suite with coverage
        run: .venv/bin/pytest -v --cov=omrkit --cov-report=term-missing

  studio-build:
    name: Web Studio (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build production bundle
        run: npm run build
